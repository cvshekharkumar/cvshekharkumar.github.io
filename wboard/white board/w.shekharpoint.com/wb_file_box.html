<p><img src="images/file-upload.png"  style="width:60px; height:60px"/></p>
<p>Select your presentation file from any local drive to be uploaded to whiteboard</p>

<form action="https://w.send18.com/wb_presentation.php"  accept="text/plain" method="post" enctype="multipart/form-data" id="fileuploadform">
<input type="hidden" name="sessionid" value="" id="sessionid"/>
<table style="width:100%; text-align: center">
   <tr style="text-align:center;height:100px;">
   <td>File:</td>
   <td><input name="file" id="file" class="f1 easyui-filebox"></input></td>
   </tr>
</table>
</form>
<div style="text-align:center;padding:5px">
<a href="javascript:void(0)" class="easyui-linkbutton" onclick="uploadFile()" style="width:60px"> Upload </a>
<a href="javascript:void(0)" class="easyui-linkbutton" onclick="closeSign()" style="width:60px"> Cancel </a>
</div>
<br>
</div>
<script src="theme/js/jquery.form.html"></script> 
<script>
function uploadFile(){
  $("#sessionid").val( sessionid );
    var filename = null;
    $('#fileuploadform').ajaxForm({
          beforeSend: function() {
               var $file = $('#fileuploadform').find("input[type=file]");
               filename = $('input[type=file]').val().replace(/C:\\fakepath\\/i, '');
               if (!$file.val() || $file.val() == "") {
                  $.messager.alert('Alert Message','No file selected to be uploaded!', 'info');
                  return false;
               }
               $('#sign').window('close');
               $("#wait").html("Processing presentation, it may take some time...");
               $('.wrapLoader').show();
         },
         success:function(data) {
              $("#south").html(data);
              $('.wrapLoader').hide();
              $("#cc").layout('panel','south').panel({
                 title:'Slides',
                 iconCls:'icon-image-editor',
              });
              $("#south").attr('height','115px');
              $("#cc").layout('expand','south');
              $("#south #content-slider").lightSlider({
                loop:false,
                keyPress:false,
                pager:false
              });
         }
    });
    $('#fileuploadform').submit();
}
</script>
